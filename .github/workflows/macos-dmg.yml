#  ────────────────────────────────────────────────────────────────────────────
#  26.3-JM  →  macOS .dmg  +  Windows .exe   (AUTO-START — no buttons, no options)
#
#  Paste this over .github/workflows/macos-dmg.yml on github.com.
#  The moment you press "Commit changes", the build starts by itself.
#
#  When it finishes: Actions ▸ click the run ▸ scroll to Artifacts ▸
#  download "26.3-JM-macOS-dmg" and/or "26.3-JM-Windows-exe".
#  ────────────────────────────────────────────────────────────────────────────

name: Build macOS DMG and Windows EXE

on:
  # Any commit to these branches starts a build. No clicking required.
  push:
    branches:
      - main
      - "arena/**"
  # Still available from the Actions tab if you ever want it.
  workflow_dispatch:

concurrency:
  group: macos-dmg
  cancel-in-progress: true

env:
  # The branch that actually holds the Tauri project.
  SOURCE_REF: arena/02e09d53-source-26-3

jobs:
  dmg:
    name: Build .dmg on macOS
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - name: Check out the Tauri project
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Confirm the project is present
        run: |
          set -euo pipefail
          missing=0
          for f in package.json game.lock.json assets/app-icon.png \
                   scripts/prepare-game.mjs scripts/perf-preamble.js \
                   src-tauri/Cargo.toml src-tauri/tauri.conf.json \
                   src-tauri/Info.plist src-tauri/entitlements.plist \
                   src-tauri/src/main.rs; do
            [ -e "$f" ] || { echo "missing: $f"; missing=1; }
          done
          [ "$missing" -eq 0 ] || {
            echo "::error::Branch '$SOURCE_REF' does not contain the Tauri project."
            exit 1
          }
          echo "Project OK."

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache the 86 MB game payload
        uses: actions/cache@v6
        with:
          path: .game-cache
          key: game-${{ hashFiles('game.lock.json') }}

      - name: Install JS tooling
        run: npm install --no-audit --no-fund

      - name: Fetch, verify and prepare the game payload
        run: node scripts/prepare-game.mjs

      - name: Generate application icons
        run: npx tauri icon assets/app-icon.png

      - name: Build the universal .dmg
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      - name: Collect the .dmg
        run: |
          set -euo pipefail
          mkdir -p out
          found=0
          while IFS= read -r -d '' f; do
            cp "$f" out/
            found=1
          done < <(find src-tauri/target -name '*.dmg' -print0)

          if [ "$found" -eq 0 ]; then
            echo "::error::No .dmg was produced."
            find src-tauri/target -maxdepth 5 -type d -name bundle || true
            exit 1
          fi

          cd out
          for f in *.dmg; do
            mv -f "$f" "26.3-JM-macOS-universal.dmg"
            break
          done
          shasum -a 256 *.dmg | tee SHA256SUMS-dmg.txt
          ls -lh

      - name: Upload the .dmg
        uses: actions/upload-artifact@v7
        with:
          name: 26.3-JM-macOS-dmg
          path: out/*
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          {
            echo "### 26.3-JM macOS build"
            echo
            if [ -d out ]; then
              echo '```'
              ls -lh out
              echo '```'
              echo "Download **26.3-JM-macOS-dmg** from the Artifacts section of this run."
            else
              echo "No artifact produced — check the logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  exe:
    name: Build .exe on Windows
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out the Tauri project
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: windows-cargo-

      - name: Cache the 86 MB game payload
        uses: actions/cache@v6
        with:
          path: .game-cache
          key: game-${{ hashFiles('game.lock.json') }}

      - name: Install JS tooling
        run: npm install --no-audit --no-fund

      - name: Fetch, verify and prepare the game payload
        run: node scripts/prepare-game.mjs

      - name: Generate application icons
        run: npx tauri icon assets/app-icon.png

      - name: Build the Windows installer
        run: npx tauri build --bundles nsis

      - name: Collect the .exe files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          # 1. The NSIS setup program - what most people want.
          setup="$(find src-tauri/target -path '*bundle/nsis/*.exe' | head -1 || true)"
          if [ -z "$setup" ]; then
            echo "::error::No NSIS installer was produced."
            find src-tauri/target -maxdepth 5 -type d -name bundle || true
            exit 1
          fi
          cp "$setup" "out/26.3-JM-Windows-Setup.exe"

          # 2. The bare application binary, for people who want no installer.
          #    The game is embedded in it; it only needs the WebView2 runtime.
          app="$(find src-tauri/target/release -maxdepth 1 -name '*.exe' | head -1 || true)"
          if [ -n "$app" ]; then cp "$app" "out/26.3-JM-Windows-portable.exe"; fi

          cd out
          sha256sum *.exe | tee SHA256SUMS-exe.txt
          ls -lh

      - name: Upload the .exe
        uses: actions/upload-artifact@v7
        with:
          name: 26.3-JM-Windows-exe
          path: out/*
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 26.3-JM Windows build"
            echo
            if [ -d out ]; then
              echo '```'
              ls -lh out
              echo '```'
              echo "Download **26.3-JM-Windows-exe** from the Artifacts section of this run."
            else
              echo "No artifact produced - check the logs above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
